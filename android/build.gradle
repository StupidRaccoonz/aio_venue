allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// AGP 8.x requires namespace on all library modules. Older Flutter plugins that
// predate this requirement won't have one set. Flutter's plugin loader sets
// project.group to the plugin's package name, so use that as the namespace.
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library")) {
            def android = project.extensions.findByName("android")
            if (android != null && android.namespace == null) {
                android.namespace = project.group.toString()
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
